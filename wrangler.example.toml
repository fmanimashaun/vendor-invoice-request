# Copy to wrangler.toml and fill in your own ids. wrangler.toml is gitignored:
# resource ids, your Access team domain and your AUD tag are deployment
# configuration and must never land in the repository.
#
#   cp wrangler.example.toml wrangler.toml
#   npx wrangler d1 create vendor-invoice-request      # paste the id below
#   npx wrangler kv namespace create ASSETS_KV         # paste the id below
#   npx wrangler secret put SESSION_SECRET

name = "vendor-invoice-request"
main = "worker/worker.js"
compatibility_date = "2026-01-15"

# ── Custom domain ──────────────────────────────────────────────────────
# MUST stay above the first [[table]] below. TOML assigns a bare key to the
# most recent table header, so putting this further down makes wrangler read
# it as a field of that table and ignore it — with only a warning.
#
# Uncomment once the zone is ACTIVE in this Cloudflare account. Deploying
# before then fails: the route cannot be provisioned without the zone.
# `custom_domain = true` creates the DNS record and the certificate for you.
#
# This key DOES reach Cloudflare — but only if you rebuild. `npx wrangler
# deploy` ships whatever is already in dist/, so an edit here that has not
# been through `npm run build` is silently not deployed and the deploy reports
# only the workers.dev trigger. Always `npm run deploy`. To check what is
# actually about to ship:
#
#   grep routes dist/<worker-name>/wrangler.json
#
# routes = [
#   { pattern = "app.example.com", custom_domain = true }
# ]
#
# Once it resolves, disable the workers.dev route so the app has one address.

[assets]
directory = "./dist"
binding = "ASSETS"
# Assets normally bypass the Worker, which means the redirect to HTTPS in
# worker.js never runs for the HTML page itself — the one request where it
# matters most, because the page's origin decides whether the Secure session
# cookie can be stored at all. Running the Worker first costs one invocation
# per asset request; there are four of them.
run_worker_first = true


[[d1_databases]]
binding = "DB"
database_name = "vendor-invoice-request"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Letterhead artwork per vendor (<vendor-code>/header.png ...) + shared fonts.
[[kv_namespaces]]
binding = "ASSETS_KV"
id = "REPLACE_WITH_YOUR_KV_ID"
#
# Once it resolves, turn the workers.dev URL off so the app has exactly one
# address — Workers & Pages -> the Worker -> Settings -> Domains & Routes ->
# disable the workers.dev route. Two live URLs for a document system is one
# more than anyone needs to audit.

[vars]
# Cloudflare Access — required for client-side SSO. Without both of these the
# Worker skips the Access path entirely and only password login works, which is
# correct locally and wrong in production.
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "the-access-application-aud-tag"

# Sign-in methods. Both default to on; SSO additionally requires the two
# ACCESS_* values above, so it is never advertised when it cannot work.
# Turning both off is refused at runtime rather than locking everyone out.
#
# Which identity provider SSO uses is NOT set here. Attach exactly one IdP to
# the Access application to skip Cloudflare's provider chooser, or attach both
# to keep it.
# AUTH_SSO_ENABLED = "false"
# AUTH_PASSWORD_ENABLED = "false"
# SSO_BUTTON_LABEL = "Sign in with Microsoft"

# Optional, defence in depth: only these email domains may be auto-provisioned
# on first SSO sign-in, even if the Access policy is later widened.
# SSO_ALLOWED_DOMAINS = "yourcompany.com"

# Secret, set with: npx wrangler secret put SESSION_SECRET
# SESSION_SECRET

# ── Observability ──────────────────────────────────────────────────────
# Worker logs and traces, kept by Cloudflare and readable in the dashboard
# under the Worker -> Logs, instead of only in a `wrangler tail` you happened
# to have running. This app logs things you want to be able to look up after
# the fact rather than catch live: BANK_DETAILS_CHANGED on any change to who
# gets paid, SEQ_WATERMARK_READ_FAILED when the numbering floor cannot be
# read, and PASSWORD_HASH_UNVERIFIABLE for an account that can never sign in.
#
# head_sampling_rate = 1 keeps everything. At this volume — a handful of
# requests per invoice — sampling would only lose the one event you came
# looking for.
[observability]
enabled = true
head_sampling_rate = 1
# Query strings are logged. Nothing secret travels in one here: the filters
# are dates, a status and a period. Keep it that way — a token or a password
# in a query string would land in retained logs, and never put one there.
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# One log line per request even when the handler prints nothing, so a route
# that 500s before reaching any console call still leaves a trace.
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
